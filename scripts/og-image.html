<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <!-- Source for public/og-image.png. Render it with `npm run og`. Fonts load from node_modules. Matches the hero. -->
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Fraunces';
        src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2') format('woff2');
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: 'Inter';
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }

      :root {
        --bg: #faf6f1;
        --surface: #f1e8df;
        --text: #2b1d17;
        --muted: #7a6358;
        --accent: #b86b77;
        --accent-ink: #9a4c59;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 1120px;
        height: 550px;
        border-radius: 40px;
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 72px 0 64px;
      }

      .portrait {
        position: relative;
        flex-shrink: 0;
        width: 380px;
        height: 380px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .portrait svg {
        position: absolute;
        inset: 0;
      }
      .portrait text {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 4.4px;
        fill: var(--muted);
      }
      .portrait .star {
        fill: var(--accent-ink);
      }
      .halo {
        position: absolute;
        width: 269px;
        height: 269px;
        border-radius: 50%;
        background: var(--bg);
      }
      .photo {
        position: relative;
        width: 253px;
        height: 253px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 30%;
        box-shadow: 0 18px 40px rgb(43 29 23 / 0.18);
      }

      .copy {
        display: flex;
        flex-direction: column;
      }
      .hi {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-size: 34px;
        color: var(--muted);
      }
      h1 {
        margin-top: 4px;
        font-family: 'Fraunces', serif;
        font-size: 112px;
        font-weight: 600;
        line-height: 0.92;
        letter-spacing: -0.045em;
        font-variation-settings:
          'opsz' 144,
          'SOFT' 30,
          'WONK' 1;
      }
      h1 span {
        color: var(--accent);
      }
      .tagline {
        margin-top: 26px;
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-size: 42px;
        color: var(--accent-ink);
      }
      .meta {
        margin-top: 30px;
        padding-top: 24px;
        border-top: 1px solid rgb(43 29 23 / 0.14);
        display: flex;
        justify-content: space-between;
        gap: 40px;
        font-size: 21px;
        color: var(--muted);
      }
      .meta b {
        font-weight: 500;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="portrait">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <circle
            cx="150"
            cy="150"
            r="146"
            fill="none"
            stroke="#9a4c59"
            stroke-width="1.5"
            stroke-dasharray="1 9"
            stroke-linecap="round"
            opacity="0.55"
          />
        </svg>
        <svg viewBox="0 0 300 300" aria-hidden="true" style="transform: rotate(-58deg)">
          <defs><path id="ring" d="M150,150 m-124,0 a124,124 0 1,1 248,0 a124,124 0 1,1 -248,0" /></defs>
          <text>
            <textPath href="#ring" textLength="779" lengthAdjust="spacing">
              CS + APPLIED MATH <tspan class="star">✦</tspan> VANDERBILT ’27 <tspan class="star">✦</tspan> AI SOLUTIONS
              <tspan class="star">✦</tspan> TECH STRATEGY <tspan class="star">✦</tspan> PRODUCT
              <tspan class="star">✦</tspan>
            </textPath>
          </text>
        </svg>
        <div class="halo"></div>
        <img class="photo" src="../public/headshot.jpg" alt="" />
      </div>

      <div class="copy">
        <p class="hi">Hi, I’m</p>
        <h1>Julia<br />Kantzer<span>.</span></h1>
        <p class="tagline">Turning AI into impact.</p>
        <p class="meta"><span>CS + Applied Math, Vanderbilt ’27</span><b>juliakantzer.com</b></p>
      </div>
    </div>
  </body>
</html>
