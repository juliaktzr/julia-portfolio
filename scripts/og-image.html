<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <!-- Source for public/og-image.png. Render it with `npm run og`. Fonts load from node_modules. -->
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Inter';
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 800;
      }

      :root {
        --bg: #faf6f1;
        --surface: #f1e8df;
        --text: #2b1d17;
        --muted: #7a6358;
        --accent: #b86b77;
        --accent-ink: #9a4c59;
        --accent-2: #8a5a44;
        --line: rgb(43 29 23 / 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: var(--bg);
        background-image:
          linear-gradient(rgb(43 29 23 / 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgb(43 29 23 / 0.04) 1px, transparent 1px);
        background-size: 56px 56px;
        color: var(--text);
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 1050px;
        height: 480px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 30px 70px -30px rgb(43 29 23 / 0.25);
        display: flex;
        flex-direction: column;
      }

      .chrome {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 62px;
        padding: 0 26px;
        border-bottom: 1px solid var(--line);
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        color: var(--muted);
      }
      .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
      }
      .chrome span:last-child {
        margin-left: 14px;
      }

      .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 40px 52px 32px;
      }

      .cmd {
        font-family: 'JetBrains Mono', monospace;
        font-size: 21px;
        color: var(--muted);
      }
      .cmd b {
        color: var(--accent);
        font-weight: 500;
        margin-right: 12px;
      }

      h1 {
        margin-top: 10px;
        font-family: 'Fraunces', serif;
        font-size: 92px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
        font-variation-settings:
          'opsz' 144,
          'SOFT' 30,
          'WONK' 1;
      }
      h1 span {
        color: var(--accent);
      }

      .line {
        margin-top: 14px;
        font-size: 34px;
        line-height: 1.3;
      }

      .meta {
        margin-top: 18px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        color: var(--muted);
      }

      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .pills {
        display: flex;
        gap: 12px;
      }
      .pill {
        padding: 7px 17px;
        border: 1px solid rgb(138 90 68 / 0.35);
        border-radius: 999px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        color: var(--accent-2);
      }
      .url {
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        color: var(--accent-ink);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="chrome">
        <i class="dot" style="background: #b86b77"></i>
        <i class="dot" style="background: #8a5a44"></i>
        <i class="dot" style="background: #a89286"></i>
        <span>julia@vanderbilt ~ zsh</span>
      </div>
      <div class="body">
        <p class="cmd"><b>❯</b>whoami</p>
        <h1>Julia Kantzer<span>.</span></h1>
        <p class="line">Making AI useful.</p>
        <p class="meta"># CS + Applied Math at Vanderbilt, May 2027</p>
        <div class="foot">
          <div class="pills">
            <span class="pill">AI</span>
            <span class="pill">Strategy</span>
            <span class="pill">Full-stack</span>
          </div>
          <span class="url">juliakantzer.com</span>
        </div>
      </div>
    </div>
  </body>
</html>
